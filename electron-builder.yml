appId: com.hias.diff
productName: hias-diff
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
compression: maximum

# ──────────────────────────────────────────────
# Windows
# ──────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-${os}-${arch}-setup.${ext}
  shortcutName: hias-diff
portable:
  artifactName: ${productName}-${version}-${os}-${arch}-portable.${ext}

# ──────────────────────────────────────────────
# macOS
# ──────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch:
        - x64
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
dmg:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# ──────────────────────────────────────────────
# Linux
# ──────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  category: Utility
deb:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
rpm:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

npmRebuild: false
