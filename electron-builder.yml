appId: com.hias.diff
productName: hias-diff
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: hias-diff
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
  category: Utility
npmRebuild: false
